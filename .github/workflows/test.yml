name: Build and test standalone package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest numpy scipy stim gdstk dimod dwave-networkx dwave-samplers dwave-system minorminer
      - run: python tools/check_source_hygiene.py --tracked-only
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -q
      - run: quantum-circuit-simulator example > "$RUNNER_TEMP/pauli-example.json" && quantum-circuit-simulator run "$RUNNER_TEMP/pauli-example.json"
  comparison-contracts:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' -r benchmarks/requirements.txt
      - run: python -m pytest -q benchmarks/test_comparators.py
# Source publication and binary/package uploads are deliberate separate actions.
