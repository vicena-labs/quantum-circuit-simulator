[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-circuit-simulator"
version = "0.5.0rc5"
description = "Quantum circuit simulator by Vicena: noisy circuits on realistic chips, algorithm development with exact gradients, and chip design, for AI agents"
readme = "README.md"
authors = [{ name = "Mehdi Farza" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
keywords = ["quantum computing", "quantum annealing", "ibm quantum", "google quantum", "gdsii", "quantum circuit simulator", "pauli propagation", "noise", "gradients", "vqe", "qaoa", "chip design", "ai agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/vicena-labs/quantum-circuit-simulator"
Issues = "https://github.com/vicena-labs/quantum-circuit-simulator/issues"
Changelog = "https://github.com/vicena-labs/quantum-circuit-simulator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
qiskit = ["qiskit>=1.3"]
dwave = ["dwave-networkx>=0.8", "dimod>=0.12", "dwave-samplers>=1.4", "dwave-system>=1.24", "minorminer>=0.2"]
stim = ["stim>=1.14"]
algorithms = ["scipy>=1.11"]
chemistry = ["pyscf>=2.6", "scipy>=1.11"]
all = ["qiskit>=1.3", "dwave-networkx>=0.8", "dimod>=0.12", "dwave-samplers>=1.4", "dwave-system>=1.24",
       "minorminer>=0.2", "stim>=1.14", "scipy>=1.11", "pyscf>=2.6"]

[project.scripts]
quantum-circuit-simulator = "quantum_circuit_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_circuit_simulator = ["AGENT_GUIDE.md", "data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
